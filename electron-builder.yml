appId: com.clmc.takeoff
productName: CLMC Takeoff
publish: null
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/release-notes.json
  - resources/icon.png
  - resources/third-party-notices.json
  - package.json
  - node_modules/**
  - '!**/{test,tests,__tests__,fixtures,example,examples}/**'
  - '!**/*.{map,ts}'
  - '!**/{.env,.env.*,dev-app-update.yml,app-update.yml}'
asar: true
beforePack: scripts/prepare-release.cjs
win:
  executableName: clmc-takeoff
  target:
    - target: nsis
      arch: [x64]
nsis:
  perMachine: false
  oneClick: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${name}-${version}-x64-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
